<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <style>
    :root {
      --sidebar-width: 250px;
    }

    body {
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      padding-top: 1rem;
      background: #0d6efd;
      /* primary */
      color: white;
    }

    .sidebar a {
      color: rgba(255, 255, 255, 0.95);
      text-decoration: none;
    }

    .sidebar .nav-link.active {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 0.5rem;
    }

    .content {
      padding: 1.5rem;
      flex: 1;
      background: #f8f9fa;
    }

    /* Make sidebar collapse on small screens */
    @media (max-width: 991.98px) {
      .sidebar {
        position: fixed;
        transform: translateX(-110%);
        transition: transform .25s ease-in-out;
        z-index: 1045;
      }

      .sidebar.show {
        transform: translateX(0);
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1040;
        display: none;
      }

      .overlay.show {
        display: block
      }
    }
  </style>
</head>

<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar d-none d-lg-block">
      <div class="px-3">
        <h4 class="mb-3">Admin</h4>
        <p class="small">Xin chào, Quản trị viên</p>
        <hr class="border-light">
        <nav class="nav flex-column gap-1">
          <a class="nav-link active" href="#"><i class="bi bi-speedometer2"></i> Tổng quan</a>
          <a class="nav-link" href="#"><i class="bi bi-people"></i> Người dùng</a>
          <a class="nav-link" href="#"><i class="bi bi-box-seam"></i> Sản phẩm</a>
          <a class="nav-link" href="#"><i class="bi bi-receipt"></i> Đơn hàng</a>
          <a class="nav-link" href="#"><i class="bi bi-gear"></i> Cài đặt</a>
        </nav>
        <div class="mt-4">
          <button id="logoutBtn" class="btn btn-sm btn-light text-primary">Đăng xuất</button>
        </div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content">
      <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="m-0">Cập nhật sản phẩm</h2>
          <div class="d-flex gap-2 align-items-center">
            <input class="form-control form-control-sm" style="width:220px" placeholder="Tìm kiếm..." />
            <button class="btn btn-primary btn-sm">Tìm</button>
          </div>
        </div>

        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Tên sản phẩm</label>
            <input type="text" class="form-control" id="name">
          </div>

          <div class="mb-3">
            <label for="image" class="form-label">Hình ảnh</label>
            <input type="text" class="form-control" id="image">
          </div>

          <div class="mb-3">
            <label for="price" class="form-label">Giá bán</label>
            <input type="number" class="form-control" id="price">
          </div>

          <div class="mb-3">
            <label for="stock" class="form-label">Số lượng</label>
            <input type="number" class="form-control" id="stock">
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Danh mục</label>
            <select class="form-select" id="category">
              <option value="-1">Open this select category</option>
              <option value="Laptop">Laptop</option>
              <option value="Điện thoại">Điện thoại</option>
              <option value="Phụ kiện">Phụ kiện</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="status" class="form-label">Trạng thái</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="status" value="1" id="inStock">
              <label class="form-check-label" for="inStock">
                Còn hàng
              </label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="status" value="0" id="outStock">
              <label class="form-check-label" for="outStock">
                Hết hàng
              </label>
            </div>
          </div>


          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="../../controllers/admin/product-edit.js"></script>
</body>

</html>
